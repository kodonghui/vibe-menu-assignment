name: Verify menu assignment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          # Disposable CI database only; these are not local or production credentials.
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: vibe_menu_assignment
          MYSQL_USER: vibe_menu
          MYSQL_PASSWORD: ci-menu-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3307/vibe_menu_assignment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: vibe_menu
      DB_PASSWORD: ci-menu-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and executable JAR
        working-directory: backend
        run: ./gradlew test bootJar --no-daemon --console=plain
      - name: Frontend install, unit tests, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Shared design token contract
        run: node scripts/check-tokens.mjs
      - name: Start API with MySQL
        working-directory: backend
        run: |
          mkdir -p .runtime
          nohup java -jar build/libs/vibe-menu-api-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql > .runtime/ci-api.log 2>&1 &
          echo "$!" > .runtime/ci-api.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8090/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          cat .runtime/ci-api.log
          exit 1
      - name: Real MySQL API, CORS and Swagger contract
        run: node scripts/verify-api.mjs
      - name: Install Chromium for browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests against MySQL API
        working-directory: frontend
        run: npm run test:e2e
      - name: Stop test API
        if: always()
        run: |
          if [ -f backend/.runtime/ci-api.pid ]; then
            kill "$(cat backend/.runtime/ci-api.pid)" 2>/dev/null || true
          fi
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            backend/build/reports/tests/test/
            backend/.runtime/ci-api.log
            frontend/playwright-report/
            frontend/test-results/
